<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>领克数字钥匙 · 首页布局提案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e9e5;color:#222725;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #598afa;outline-offset:4px}button{color:inherit}a{color:inherit;text-decoration:none}svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.workbench{max-width:1700px;margin:auto;padding:46px 40px 65px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:600}.intro h1{font-size:30px;letter-spacing:-1px;margin:12px 0}.intro p{font-size:13px;color:#686e69;line-height:1.8;margin:0}.modes{display:flex;gap:5px;background:#dcded7;padding:5px;border-radius:12px;flex-shrink:0}.modes a{padding:10px 14px;font-size:12px;border-radius:8px}.modes a.active{background:#fff;box-shadow:0 2px 5px #00000008}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.caption{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.caption h2{font-size:15px;margin:0}.caption a{font-size:11px;color:#687067;padding:8px 0 8px 8px}.caption p{font-size:11px}.phone{--muted:#888e8d;--line:#e3e6e3;--surface:#f1f3ef;position:relative;overflow:hidden;border-radius:32px;background:#fcfcf9;min-height:748px;padding:24px 22px 20px;box-shadow:0 14px 32px #1822190c;border:1px solid #fff9;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.brand{font-size:16px;font-weight:800;letter-spacing:-.8px}.connected{font-size:10px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}.connected i{width:5px;height:5px;background:#73967e;border-radius:50%}.title{margin-top:34px;position:relative;z-index:1}.title small{font-size:9px;letter-spacing:2.2px;color:var(--muted)}.title h3{font-size:29px;letter-spacing:-1.2px;font-weight:500;margin:9px 0}.title p{font-size:11px;color:var(--muted);margin:8px 0}.hero{position:relative;height:188px;display:flex;align-items:center;justify-content:center;margin:8px -22px 0}.hero img{width:110%;position:relative;z-index:1;filter:drop-shadow(0 18px 12px #0002)}.hero .giant{position:absolute;font-size:142px;font-weight:700;letter-spacing:-12px;top:-38px;color:#ebede7}.record{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:var(--muted);margin:10px 0 23px}.record svg{width:14px;height:14px}.record strong{font-weight:500;color:inherit}.locks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.locks button{height:83px;border:0;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);font-size:14px}.locks button.primary{background:#242c28;color:white}.locks small{display:block;font-size:9px;opacity:.65;margin-top:4px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 16px;font-size:12px}.section-title span{font-size:9px;color:var(--muted)}.utilities{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.utilities button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:11px}.utilities .icon{width:48px;height:48px;border-radius:16px;background:var(--surface);display:grid;place-items:center}.chevron{margin-left:auto;color:var(--muted)}.foot{margin-top:auto;padding-top:22px;display:flex;align-items:center;justify-content:space-between;font-size:8px;letter-spacing:1px;color:var(--muted)}.foot span:last-child{letter-spacing:0}.description{font-size:12px;color:#72766e;line-height:1.7;margin:16px 3px 0}.description b{color:#383f37;font-weight:500}.phone button{transition:transform .18s,background .18s}.phone button:active{transform:scale(.96)}
/* B: prominent circular unlock, auxiliary rail */
.b{background:#171a1e;color:#f1f2ed;--surface:#25292f;--muted:#949b9f;--line:#34383c}.b .title{margin-top:27px;display:flex;justify-content:space-between;align-items:center}.b .title h3{font-size:36px}.model-tag{font-size:9px;border:1px solid var(--line);padding:7px 9px;border-radius:20px;color:#a6acac}.b .hero{height:163px;background:radial-gradient(ellipse at center,#62695830,transparent 70%);margin-top:0}.b .hero .giant{font-size:105px;top:-18px;color:#ffffff05}.b .hero img{width:107%}.b .record{margin:8px 0 17px}.b .locks{grid-template-columns:1fr 1.25fr;align-items:center;margin:0 14px;gap:22px}.b .locks button{height:64px;background:transparent;border:1px solid #414746;border-radius:40px;font-size:12px}.b .locks button.primary{height:112px;width:112px;border:7px solid #242d26;outline:1px solid #455345;background:#c6dfad;color:#253022;border-radius:100%;flex-direction:column;gap:8px;justify-self:end;box-shadow:0 0 36px #bfefa111}.b .locks .primary svg{width:29px;height:29px}.b .locks small{display:none}.b .section-title{margin-top:28px}.b .utilities{grid-template-columns:1fr 1fr;gap:9px}.b .utilities button{flex-direction:row;background:var(--surface);border:1px solid #ffffff04;border-radius:13px;gap:9px;padding:10px 11px}.b .utilities .icon{width:23px;height:26px;border-radius:0}.b .utilities svg{width:21px}.b .foot{padding-top:22px}
/* C: full-bleed landscape above a floating control sheet */
.c{background:#151c25;color:#eef3f8;--muted:#a4adbb;--surface:#303946;--line:#ffffff16;padding-bottom:20px}.c::before{content:"";position:absolute;inset:0 0 auto;height:440px;background:linear-gradient(180deg,#12172533,transparent 48%,#151c25 100%),url('assets/dusk.png') center 42%/cover}.c .title{margin-top:36px}.c .title h3{font-size:31px}.c .hero{height:195px;margin-top:0}.c .hero img,.c .hero .giant{display:none}.c .record{margin:0 0 17px;color:#bdc9d6;position:relative}.control-sheet{position:relative;background:linear-gradient(140deg,#344151e8,#222d3ae8);border:1px solid #ffffff17;padding:16px;border-radius:25px;margin:0 -7px;box-shadow:0 12px 30px #0002;backdrop-filter:blur(14px)}.c .locks{gap:8px}.c .locks button{height:63px;border:1px solid #ffffff12;background:#ffffff09;border-radius:14px;font-size:13px}.c .locks button.primary{background:#d9e8f7;color:#22384b;border:0}.c .locks small{font-size:8px}.c .section-title{margin:23px 0 15px}.c .utilities .icon{background:transparent;width:40px;height:34px}.c .utilities button{font-size:10px;gap:5px}.c .foot{position:relative}
/* D: compact horizontal vehicle card and practical dashboard */
.d{background:#f0f1f5;--surface:#e9edf4;--muted:#7b8495;--line:#dbe0e9;color:#1c2941}.d .title{margin-top:31px}.d .title h3{font-size:26px}.vehicle-card{background:#e2e7ef;border-radius:20px;margin-top:19px;padding:18px;position:relative;overflow:hidden;height:153px}.vehicle-card .vehicle-id{position:relative;z-index:2;font-size:12px;font-weight:600}.vehicle-card .vehicle-id small{display:block;font-size:8px;letter-spacing:1px;font-weight:400;color:#7b8495;margin-top:7px}.d .hero{height:130px;position:absolute;inset:32px -55px auto 51px;margin:0}.d .hero img{width:100%}.d .hero .giant{font-size:100px;top:-50px;right:63px;color:#cfd7e3}.d .record{justify-content:flex-start;margin:17px 0 21px;font-size:10px}.d .locks{gap:10px}.d .locks button{height:102px;border-radius:18px;flex-direction:column;align-items:flex-start;gap:12px;padding:17px;background:#fff}.d .locks button.primary{background:#4165e8;color:white}.d .locks button>span{display:flex;align-items:baseline;width:100%;justify-content:space-between;gap:3px}.d .locks small{font-size:8px;margin:0}.d .section-title{margin:25px 0 13px}.d .utilities{grid-template-columns:repeat(2,1fr);gap:9px}.d .utilities button{background:white;border-radius:14px;padding:12px;flex-direction:row;gap:9px;font-size:11px}.d .utilities .icon{background:none;width:24px;height:29px}.d .foot{padding-top:20px}.toast{position:absolute;bottom:65px;left:20px;right:20px;color:white;background:#17221fee;box-shadow:0 6px 20px #0002;padding:12px;border-radius:12px;text-align:center;font-size:11px;z-index:5;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;line-height:1.6}.toast.visible{opacity:1;transform:none}.overlay{position:absolute;inset:0;background:#0006;z-index:8;display:flex;align-items:flex-end;padding:12px}.overlay[hidden]{display:none}.dialog{width:100%;padding:24px;border-radius:24px;background:#f7f8f4;color:#223027;box-shadow:0 -10px 60px #0002}.dialog h4{margin:0 0 12px;font-size:20px}.dialog p{font-size:12px;line-height:1.8;color:#70786d}.dialog button{border:0;padding:13px;background:#243529;color:#fff;border-radius:12px;width:100%;margin-top:10px}.single .gallery{display:block;max-width:390px;margin:auto}.single .proposal{display:none}.single .proposal.selected{display:block}.single .phone{min-height:780px}.single .intro{max-width:900px;margin:0 auto 30px}.single .description{text-align:center}.single .caption{display:none}@media(min-width:1600px){.phone{min-height:800px}.hero{height:213px}.b .hero{height:189px}.c .hero{height:222px}.c::before{height:470px}.d .vehicle-card{height:178px}.d .hero{top:45px}.utilities .icon{width:53px;height:53px}}@media(max-width:1190px){.gallery{grid-template-columns:repeat(2,minmax(0,360px));justify-content:center;gap:35px}.intro{align-items:start;flex-direction:column}.phone{min-height:770px}}@media(max-width:620px){.workbench{padding:25px 16px 35px}.intro h1{font-size:25px}.intro p{font-size:12px}.modes{width:100%;justify-content:space-between}.modes a{padding:10px 12px}.gallery{grid-template-columns:minmax(0,390px);gap:28px}.phone{min-height:750px}.single .workbench{padding:0}.single .intro{padding:14px 14px 0;margin-bottom:12px}.single .intro>div:first-child{display:none}.single .intro .modes{border-radius:10px}.single .phone{border-radius:0;border:0;min-height:calc(100svh - 67px);padding-top:24px}.single .gallery{max-width:none}.single .description{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.section-title .settings-link{border:0;background:transparent;color:var(--muted);font-size:10px;padding:12px 0 12px 12px;margin:-12px 0;min-height:44px}.dialog .settings-item{display:flex;align-items:center;gap:10px;background:#e8ece5;color:#223027;text-align:left}.settings-item span:last-child{margin-left:auto}.dialog button[hidden]{display:none}</style></head><body><main class="workbench"><header class="intro"><div><span class="eyebrow">LYNK & CO / DIGITAL KEY</span><h1>首页，换一种打开方式。</h1><p>四种布局提案 · 点击按钮体验交互 · 仅模拟操作，不连接车辆</p></div><nav class="modes" aria-label="切换设计方案"><a href="?" data-mode="all">全部对比</a><a href="?v=a" data-mode="a">A 极简</a><a href="?v=b" data-mode="b">B 驾驶舱</a><a href="?v=c" data-mode="c">C 暮色</a><a href="?v=d" data-mode="d">D 卡片</a></nav></header><div class="gallery" id="gallery"></div></main>
<script>
const icons={lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/>',unlock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V6a4 4 0 0 1 7.7-1.5M12 14v3"/>',down:'<path d="M3 9v11h18V4H8L3 9h18M12 11v6m-3-3 3 3 3-3"/>',up:'<path d="M3 9v11h18V4H8L3 9h18M12 17v-6m-3 3 3-3 3 3"/>',trunk:'<path d="m3 16 3-1 4-5h6l5 5v4h-3m-11 0h7M3 16v3m13-9 3-5h-4"/><circle cx="5" cy="19" r="2"/><circle cx="16" cy="19" r="2"/>',wash:'<path d="m4 13 2-5h12l2 5M3 13h18v7H3zM6 16h2m8 0h2M7 2v2m5-3v3m5-2v2"/>',nfc:'<rect x="4" y="3" width="12" height="18" rx="3"/><path d="M9 17h2M19 7a8 8 0 0 1 0 10M19 11a3 3 0 0 1 0 2"/>',check:'<path d="m5 12 4 4L19 6"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;
const variants=[{id:'a',name:'留白 · 极简',label:'PURE & SIMPLE',title:'我的领克 03',sub:'每一次出发，都轻松一点。',desc:'<b>大留白 + 双主按钮</b><br>车辆居中，四个次级操作横向排开，轻盈直观。'},{id:'b',name:'掌控 · 驾驶舱',label:'YOUR DIGITAL KEY',title:'领克 03',sub:'',desc:'<b>圆形主键 + 双列操作</b><br>开锁成为视觉中心，偏向单手、高频使用。'},{id:'c',name:'入夜 · 暮色',label:'READY WHEN YOU ARE',title:'下一程，随时出发',sub:'LYNK & CO 03',desc:'<b>全幅场景 + 悬浮操作面板</b><br>延续暮色氛围，把所有操作收拢到下方。'},{id:'d',name:'日常 · 卡片',label:'GOOD TO SEE YOU',title:'钥匙，就在手边',sub:'',desc:'<b>紧凑车辆卡 + 模块化控制</b><br>降低车图占比，常用功能更靠上，信息更紧凑。'}];
const headerMarkup=`<div class="top"><span class="brand">LYNK & CO</span><span class="connected"><i></i>蓝牙已连接</span></div>`;
const hero=`<div class="hero"><span class="giant">03</span><img src="assets/car.png" alt="灰色领克 03"></div>`;
const record=`<div class="record">${icon('check')}<strong class="record-text">最近指令 · 关锁升窗</strong><span>／ 本地记录</span></div>`;
const locks=`<div class="locks"><button data-action="lock">${icon('lock')}<span>关锁<small>同时升窗</small></span></button><button class="primary" data-action="unlock">${icon('unlock')}<span>开锁</span></button></div>`;
const controls=`<div class="section-title">更多控制<button class="settings-link" data-action="settings">更多设置 ···</button></div><div class="utilities">${[['down','开窗'],['up','关窗'],['trunk','后备箱'],['wash','洗车']].map(([i,t])=>`<button data-action="${i}"><span class="icon">${icon(i)}</span>${t}</button>`).join('')}</div>`;
document.querySelector('#gallery').innerHTML=variants.map(v=>`<section class="proposal" data-variant="${v.id}"><div class="caption"><h2>${v.id.toUpperCase()} / ${v.name}</h2><a href="?v=${v.id}">单独预览 ↗</a></div><article class="phone ${v.id}" aria-label="方案 ${v.id.toUpperCase()} ${v.name}">${headerMarkup}<div class="title"><div><small>${v.label}</small><h3>${v.title}</h3>${v.sub?`<p>${v.sub}</p>`:''}</div>${v.id==='b'?'<span class="model-tag">03 / 2022</span>':''}</div>${v.id==='d'?`<div class="vehicle-card"><div class="vehicle-id">LYNK & CO 03<small>MY VEHICLE</small></div>${hero}</div>`:hero}${record}${v.id==='c'?`<div class="control-sheet">${locks}${controls}</div>`:locks+controls}<div class="foot"><span>LYNK & CO · ALWAYS WITH YOU</span><span>交互预览</span></div><div class="toast" role="status" aria-live="polite"></div><div class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-label="功能预览"><h4></h4><p></p><button class="settings-item" data-action="nfc" hidden>${icon("nfc")}<span>NFC 贴片</span><span>›</span></button><button data-close>返回钥匙</button></section></div></article><p class="description">${v.desc}</p></section>`).join('');
const selected=new URLSearchParams(location.search).get('v');
const valid=variants.some(v=>v.id===selected);if(valid){document.body.classList.add('single');document.querySelector(`[data-variant="${selected}"]`).classList.add('selected');}document.querySelector(`[data-mode="${valid?selected:'all'}"]`).classList.add('active');
document.querySelectorAll('.phone').forEach(phone=>{
  let timer, opener, nextAction='开锁';
  const overlay=phone.querySelector('.overlay');
  const settingsItem=overlay.querySelector('.settings-item');
  function close(){overlay.hidden=true;opener?.focus();}
  phone.addEventListener('click',e=>{
    const button=e.target.closest('button');
    if(!button)return;
    if(button.hasAttribute('data-close')){close();return;}
    const action=button.dataset.action;
    if(!action)return;
    if(['wash','settings','nfc'].includes(action)){
      if(overlay.hidden)opener=button;
      settingsItem.hidden=action!=='settings';
      overlay.querySelector('h4').textContent={wash:'洗车模式',settings:'更多设置',nfc:'NFC 贴片'}[action];
      overlay.querySelector('p').textContent={
        wash:'在这里查看洗车状态、设置起止时间，并选择蓝牙重连后自动退出。当前为布局预览。',
        settings:'管理钥匙的辅助功能。',
        nfc:`下次碰贴片：${nextAction} · 本地记录。正式页面可写入或停用本机贴片。当前为布局预览。`
      }[action];
      overlay.hidden=false;
      overlay.querySelector('button:not([hidden])').focus();
      return;
    }
    if(action==='lock'||action==='unlock'){
      phone.querySelector('.record-text').textContent=action==='lock'?'最近指令 · 关锁升窗':'最近指令 · 开锁';
      nextAction=action==='lock'?'开锁':'关锁升窗';
    }
    const text={lock:'模拟：已发送关锁及升窗指令',unlock:'模拟：已发送开锁指令',down:'模拟：已发送开窗指令',up:'模拟：已发送关窗指令',trunk:'模拟：已发送后备箱释放指令'};
    const toast=phone.querySelector('.toast');
    toast.textContent=text[action];toast.classList.add('visible');
    clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('visible'),2300);
  });
  overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
  overlay.addEventListener('keydown',e=>{
    if(e.key==='Escape')close();
    if(e.key==='Tab'){
      const buttons=[...overlay.querySelectorAll('button:not([hidden])')];
      const first=buttons[0],last=buttons[buttons.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });
});
</script></body></html>
