<style>
@font-face{font-family:Manrope;src:url('assets/manrope.ttf')}*{box-sizing:border-box}body{margin:0;background:#e7e8e9;color:#25282c;font-family:Manrope,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #5279d1;outline-offset:4px}a{color:inherit;text-decoration:none}button{border:0}svg{height:24px;width:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}.workbench{max-width:1360px;margin:auto;padding:35px 42px 45px}.masthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;gap:20px}.masthead h1{font-size:21px;letter-spacing:-.5px;margin:0 0 8px;font-weight:600}.masthead p{font-size:12px;color:#7a7d82;margin:0}.tabs{display:flex;gap:4px;padding:4px;border:1px solid #d2d4d6;border-radius:30px}.tabs a{padding:9px 17px;font-size:11px;border-radius:25px;white-space:nowrap}.tabs a.active{background:#25282c;color:white}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;align-items:start}.caption{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.caption h2{font-size:14px;font-weight:600;margin:0}.caption h2 span{font-size:11px;color:#979b9e;margin-right:9px}.caption a{font-size:10px;color:#7a7d82;padding:9px 0 9px 10px}.phone{--ink:#24272c;--muted:#9c9fa5;--line:#e5e6e9;position:relative;isolation:isolate;background:#fafafa;border:1px solid #fff;border-radius:32px;height:770px;overflow:hidden;box-shadow:0 18px 38px #2834410b;display:flex;flex-direction:column}.app-head{display:flex;align-items:center;justify-content:space-between;padding:28px 25px 0;position:relative;z-index:2}.wordmark{font-size:15px;letter-spacing:-.7px;font-weight:800}.head-right{display:flex;align-items:center;gap:11px}.connection{color:#787e86;font-size:10px;display:flex;align-items:center;gap:5px}.connection i{background:#7c9b8c;width:4px;height:4px;border-radius:50%}.more{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:none;color:#71777e}.more svg{width:20px}.vehicle-heading{padding:30px 25px 0}.vehicle-heading h3{font-size:26px;letter-spacing:-.7px;margin:0 0 7px;font-weight:600}.vehicle-heading p{font-size:11px;color:#8c9299;margin:0}.vehicle-space{position:relative;flex:1;min-height:180px;display:flex;align-items:center;justify-content:center}.placeholder{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:2px;color:#bdc1c7;font-weight:400;user-select:none}.placeholder:before,.placeholder:after{content:'';width:20px;height:1px;background:#dfe1e5}.demo-record{font-size:10px;color:#93989f;display:flex;justify-content:center;align-items:center;gap:6px}.demo-record svg{height:12px;width:12px}.controls{position:relative}.lock-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lock-pair button{display:flex;align-items:center;justify-content:center;gap:12px;border-radius:15px;background:#eceef1;min-height:76px;font-size:16px;font-weight:500}.lock-pair button.primary{background:#272b31;color:#fff}.lock-pair small{display:block;font-size:9px;font-weight:400;opacity:.5;margin-top:5px}.lock-pair svg{width:23px;height:23px}.utilities{display:grid;grid-template-columns:repeat(4,1fr)}.utilities button{background:none;min-width:0;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;font-size:11px;color:#646a73}.utilities svg{width:22px;height:22px}.home-indicator{width:100px;height:3px;border-radius:3px;background:#c7cad0;margin:22px auto 12px;flex:none}.layout-note{font-size:12px;line-height:1.8;color:#82868a;margin:17px 2px 0}.layout-note strong{font-weight:500;color:#454b52}.phone button{transition:background .18s,transform .18s}.phone button:active{transform:scale(.97)}

.a .vehicle-space{background:radial-gradient(ellipse at 50% 60%,#f0f1f3,transparent 64%)}.a .controls{padding:0 23px}.a .demo-record{margin-bottom:22px}.a .dock{background:#fff;border:1px solid #eceef0;border-radius:25px;padding:11px 11px 6px;box-shadow:0 10px 28px #2b354707}.a .lock-pair{gap:8px}.a .lock-pair button{min-height:79px}.a .utilities{margin-top:12px;padding-top:9px;border-top:1px solid #f0f1f3}.a .utilities button{min-height:75px}.a .home-indicator{margin-top:34px}
/* B / 侧边工具栏 + 独立主操作 */
.b .vehicle-heading{padding-top:42px}.b .vehicle-heading h3{font-size:30px}.b .vehicle-space{margin-top:7px;align-items:stretch;justify-content:stretch;min-height:285px}.b .placeholder{flex:1;justify-content:center;letter-spacing:1px;margin-right:62px;font-size:9px}.b .placeholder:before,.b .placeholder:after{width:10px}.side-rail{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:13px}.side-rail button{width:53px;height:61px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#787f88;font-size:9px}.side-rail button svg{width:22px;height:22px}.side-rail button+button{border-top:1px solid #e9ebee;padding-top:12px;height:72px}.b .controls{padding:10px 26px 0}.b .demo-record{justify-content:flex-start;margin-bottom:23px;padding-bottom:15px;border-bottom:1px solid var(--line)}.b .lock-pair{gap:15px}.b .lock-pair button{height:112px;border-radius:19px;flex-direction:column;gap:12px;background:#eff0f2}.b .lock-pair button.primary{background:#272b31}.b .lock-pair button span{display:flex;align-items:baseline;gap:5px}.b .lock-pair small{font-size:8px;margin:0}.b .home-indicator{margin-top:38px}

.c{background:#f4f5f7}.c .vehicle-heading{text-align:center;padding-top:38px}.c .vehicle-heading h3{font-size:26px}.c .vehicle-space{min-height:235px}.c .controls{padding:0 29px 28px}.c .demo-record{margin-bottom:20px}.c .lock-pair{gap:0;border-radius:50px;padding:5px;background:#fff;box-shadow:0 6px 22px #2a35400a;border:1px solid #e8eaed}.c .lock-pair button{min-height:66px;background:none;border-radius:50px;font-size:14px;gap:10px}.c .lock-pair button.primary{background:#272b31}.c .lock-pair small{display:none}.drawer{background:#fff;border-top:1px solid #e8eaed;border-radius:27px 27px 0 0;padding:0 22px 0}.drawer-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;padding:23px 3px;font-size:12px;color:#5d646d}.drawer-toggle .toggle-label{display:flex;align-items:center;gap:10px}.drawer-toggle svg{width:17px;height:17px}.drawer-toggle .arrow{width:15px;transform:rotate(180deg);transition:transform .2s}.drawer-toggle[aria-expanded="false"] .arrow{transform:none}.drawer .utilities{border-top:1px solid #f1f2f4;padding:8px 0 0}.drawer .utilities[hidden]{display:none}.drawer .utilities button{min-height:73px}.c .home-indicator{margin-top:15px}.drawer-hint{color:#a4a8af;font-size:9px}.toast{position:absolute;left:25px;right:25px;bottom:240px;border-radius:12px;padding:13px 16px;background:#272c34ed;color:white;box-shadow:0 7px 25px #0001;text-align:center;font-size:11px;line-height:1.6;opacity:0;transform:translateY(7px);transition:.18s;pointer-events:none;z-index:4}.toast.visible{opacity:1;transform:none}.modal{position:absolute;inset:0;z-index:10;background:#1b24394a;display:flex;align-items:flex-end;padding:10px}.modal[hidden]{display:none}.sheet{width:100%;border-radius:25px;background:#fff;padding:24px}.sheet h4{font-size:19px;margin:0 0 19px}.sheet p{font-size:12px;color:#868c95;line-height:1.8;margin:0 0 18px}.sheet button{background:#f3f4f6;min-height:48px;border-radius:12px;padding:12px 15px;width:100%;text-align:left;font-size:13px;margin-top:8px}.sheet button[hidden]{display:none}.sheet .close{background:#272b31;color:white;text-align:center}.solo .gallery{display:block;max-width:390px;margin:auto}.solo .proposal{display:none}.solo .proposal.selected{display:block}.solo .caption{display:none}.solo .masthead{max-width:900px;margin:0 auto 32px}.solo .layout-note{text-align:center}@media(max-width:1050px){.workbench{padding:28px 22px}.gallery{gap:16px}.phone{height:730px}.app-head{padding:23px 18px 0}.wordmark{font-size:13px}.head-right{gap:4px}.connection{font-size:9px}.vehicle-heading{padding-left:22px}.a .controls{padding:0 15px}.b .controls{padding-left:20px;padding-right:20px}.c .controls{padding-left:18px;padding-right:18px}.lock-pair button{font-size:14px;gap:8px}}@media(max-width:800px){.gallery{grid-template-columns:minmax(0,390px);justify-content:center;gap:36px}.phone{height:780px}.masthead{flex-direction:column;align-items:flex-start;gap:20px}.tabs{width:100%;justify-content:space-between;max-width:390px}.tabs a{padding:9px 12px}.app-head{padding:28px 25px 0}.wordmark{font-size:15px}.head-right{gap:11px}.connection{font-size:10px}.a .controls{padding:0 23px}.b .controls{padding:10px 26px 0}.c .controls{padding:0 29px 28px}}@media(max-width:460px){.workbench{padding:24px 17px}.masthead h1{font-size:20px}.masthead p{font-size:11px}.phone{height:750px}.solo .workbench{padding:0}.solo .masthead{padding:12px;margin:0}.solo .masthead>div{display:none}.solo .tabs{max-width:none}.solo .gallery{max-width:none}.solo .phone{border:0;border-radius:0;box-shadow:none;height:calc(100svh - 66px);min-height:650px}.solo .layout-note{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* 与原 App 共用暮色场景；灰底白字，车辆展示仍留空。 */
body{background:#10151b;color:#e0e5ed}
.masthead p,.caption a,.layout-note{color:#929da9}
.caption h2 span{color:#72808f}.layout-note strong{color:#cad3dd}
.tabs{border-color:#323b46;background:#1d232b}.tabs a{color:#aab5c2}.tabs a.active{background:#3a4552;color:#f2f5fa}
.phone,.c{--ink:#f2f5fa;--muted:#bbc5d0;--line:#35404c;color:var(--ink);background:#10151b url('assets/dusk.png') center top / 100% auto no-repeat;border-color:#303b49;box-shadow:0 18px 42px #0004}
.phone::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 32% 12%,#c9d5e64d 0 1px,transparent 1.6px),radial-gradient(circle at 35% 13%,#c9d5e638 0 .7px,transparent 1.4px),radial-gradient(circle at 59% 15%,#c9d5e643 0 1px,transparent 1.7px),radial-gradient(circle at 85% 12%,#c9d5e633 0 1px,transparent 1.6px),radial-gradient(circle at 64% 18%,#c9d5e62b 0 .8px,transparent 1.6px),radial-gradient(circle at 16% 21%,#c9d5e630 0 .8px,transparent 1.6px)}
.connection{color:#bbc5d0}.connection i{background:#8ba99f}.more{color:#bbc5d0}.more:hover{background:#ffffff0c}
.vehicle-heading p{color:#b0bac8}.placeholder{color:#b5bfce}.placeholder:before,.placeholder:after{background:#9ca9bd55}
.demo-record{color:#aebac9}.home-indicator{background:#56606b}
.lock-pair button,.lock-pair button.primary,.b .lock-pair button,.b .lock-pair button.primary,.c .lock-pair button,.c .lock-pair button.primary{background:#272e37;color:#f2f5fa}
.lock-pair small{opacity:1;color:#a7b4c4}
.utilities button{color:#d4dde8}
.a .vehicle-space{background:none}
.a .dock{background:#1d232bf2;border-color:#38424f;box-shadow:0 12px 32px #0002}
.a .utilities{border-top-color:#ffffff0b}
.side-rail button{color:#d4dde8;background:#272e37dc;border-radius:14px}.side-rail button+button{border-top-color:transparent}
.c .lock-pair{background:#272e37d9;border-color:#3d4754;box-shadow:0 8px 24px #0002;position:relative}
.c .lock-pair::after{content:"";position:absolute;left:50%;top:24px;bottom:24px;width:1px;background:#53607066}
.c .lock-pair button,.c .lock-pair button.primary{background:transparent}
.drawer{background:#1d232bf5;border-top-color:#2c3540}
.drawer-toggle{color:#e0e5ed}.drawer-hint{color:#a2afbf}.drawer .utilities{border-top-color:#ffffff0c}
.toast{background:#2b3543f5;color:#f2f5fa;box-shadow:0 8px 26px #0003;border:1px solid #495769}
.modal{background:#080d15a6}.sheet{background:#1d232b;color:#e4ebf4;border:1px solid #394453}.sheet p{color:#bbc5d0}
.sheet button{background:#272e37;color:#e0e6ef}.sheet .close{background:#36424f;color:#f2f5fa}
</style>
</head>
<body>
<main class="workbench"><header class="masthead"><div><h1>先看布局，再做细节。</h1><p>第二轮 / 暮色配色，只比较结构。车辆区域暂留空。</p></div><nav class="tabs" aria-label="布局方案"><a href="?" data-tab="all">并排对比</a><a href="?v=a" data-tab="a">01 底部操作台</a><a href="?v=b" data-tab="b">02 侧边工具栏</a><a href="?v=c" data-tab="c">03 分层抽屉</a></nav></header><div class="gallery"></div></main>
<script>
const paths={lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/>',unlock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V6a4 4 0 0 1 7.7-1.5M12 14v3"/>',down:'<path d="M3 9v11h18V4H8L3 9h18M12 11v6m-3-3 3 3 3-3"/>',up:'<path d="M3 9v11h18V4H8L3 9h18M12 17v-6m-3 3 3-3 3 3"/>',trunk:'<path d="m3 16 3-1 4-5h6l5 5v4h-3m-11 0h7M3 16v3m13-9 3-5h-4"/><circle cx="5" cy="19" r="2"/><circle cx="16" cy="19" r="2"/>',wash:'<path d="m4 13 2-5h12l2 5M3 13h18v7H3zM6 16h2m8 0h2M7 2v2m5-3v3m5-2v2"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',check:'<path d="m6 12 4 4 8-8"/>',arrow:'<path d="m7 10 5 5 5-5"/>',sliders:'<path d="M3 7h9m5 0h4M3 17h4m5 0h9"/><circle cx="14" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'};
const svg=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
const toolbar=cls=>`<div class="${cls}">${[['down','开窗'],['up','关窗'],['trunk','后备箱'],['wash','洗车']].map(([key,title])=>`<button data-action="${key}">${svg(key)}<span>${title}</span></button>`).join('')}</div>`;
const locks=`<div class="lock-pair"><button data-action="lock">${svg('lock')}<span>关锁<small>同时升窗</small></span></button><button class="primary" data-action="unlock">${svg('unlock')}<span>开锁</span></button></div>`;
const record=`<div class="demo-record">${svg('check')}<span class="record-text">最近指令：关锁升窗</span><span>· 本地记录</span></div>`;
const variants=[{id:'a',num:'01',name:'底部操作台',note:'<strong>最集中。</strong> 上半屏完整留给车辆，全部操作收在底部，主次通过大小和间距区分。'},{id:'b',num:'02',name:'侧边工具栏',note:'<strong>最舒展。</strong> 辅助操作沿车侧排列，底部只保留两个主键，拇指区更干净。'},{id:'c',num:'03',name:'分层抽屉',note:'<strong>最克制。</strong> 开关锁独立悬浮；下方抽屉可收起，让车辆展示区随之扩大。'}];
document.querySelector('.gallery').innerHTML=variants.map(v=>`<section class="proposal" data-variant="${v.id}"><div class="caption"><h2><span>${v.num}</span>${v.name}</h2><a href="?v=${v.id}">单独查看 ↗</a></div><article class="phone ${v.id}" aria-label="${v.name}"><header class="app-head"><span class="wordmark">LYNK & CO</span><div class="head-right"><span class="connection"><i></i>已连接</span><button class="more" data-action="settings" aria-label="更多设置">${svg('more')}</button></div></header><div class="vehicle-heading"><h3>领克 03</h3><p>我的数字钥匙</p></div><div class="vehicle-space" aria-label="车辆展示预留区域"><span class="placeholder">车辆展示区</span>${v.id==='b'?toolbar('side-rail'):''}</div><div class="controls">${record}${v.id==='a'?`<div class="dock">${locks}${toolbar('utilities')}</div>`:locks}</div>${v.id==='c'?`<section class="drawer"><button class="drawer-toggle" aria-expanded="true" aria-controls="drawer-tools" data-action="drawer"><span class="toggle-label">${svg('sliders')}更多控制</span><span class="drawer-hint">车窗 · 后备箱 · 洗车</span>${svg('arrow').replace('<svg ','<svg class="arrow" ')}</button><div id="drawer-tools">${toolbar('utilities')}</div><div class="home-indicator"></div></section>`:'<div class="home-indicator"></div>'}<div class="toast" role="status" aria-live="polite"></div><div class="modal" hidden><section class="sheet" role="dialog" aria-modal="true" aria-label="功能预览"><h4></h4><p></p><button data-action="nfc" hidden>NFC 贴片设置 <span style="float:right">›</span></button><button class="close" data-action="close">返回</button></section></div></article><p class="layout-note">${v.note}</p></section>`).join('');
const variant=new URLSearchParams(location.search).get('v');
if(variants.some(v=>v.id===variant)){document.body.classList.add('solo');document.querySelector(`[data-variant="${variant}"]`).classList.add('selected');}
document.querySelector(`[data-tab="${document.body.classList.contains('solo')?variant:'all'}"]`).classList.add('active');
document.querySelectorAll('.phone').forEach(phone=>{
 let opener,timer,next='开锁';const modal=phone.querySelector('.modal');
 const close=()=>{modal.hidden=true;opener?.focus();};
 phone.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  const action=button.dataset.action;
  if(action==='close'){close();return;}
  if(action==='drawer'){const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));phone.querySelector('#drawer-tools').hidden=!open;return;}
  if(['settings','nfc','wash'].includes(action)){
   if(modal.hidden)opener=button;
   modal.querySelector('h4').textContent={settings:'更多设置',nfc:'NFC 贴片',wash:'洗车模式'}[action];
   modal.querySelector('p').textContent={settings:'钥匙辅助功能',nfc:`下次碰贴片：${next}。正式设置页可写入或停用贴片。`,wash:'正式页面在这里读取洗车状态、设置时间与自动退出。'}[action]+' · 当前为布局预览';
   modal.querySelector('[data-action="nfc"]').hidden=action!=='settings';modal.hidden=false;modal.querySelector('button:not([hidden])').focus();return;
  }
  if(action==='lock'||action==='unlock'){phone.querySelector('.record-text').textContent=action==='lock'?'最近指令：关锁升窗':'最近指令：开锁';next=action==='lock'?'开锁':'关锁升窗';}
  const message={lock:'关锁及升窗',unlock:'开锁',down:'开窗',up:'关窗',trunk:'后备箱释放'}[action];
  if(message){const toast=phone.querySelector('.toast');toast.textContent=`模拟操作：${message}`;toast.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('visible'),2200);}
 });
 modal.addEventListener('click',e=>{if(e.target===modal)close()});
 modal.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const buttons=[...modal.querySelectorAll('button:not([hidden])')];const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
});
</script>
</body></html>
