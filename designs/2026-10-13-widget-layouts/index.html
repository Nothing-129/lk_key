<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>领克 · 桌面小部件布局提案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeece9;color:#262c33;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #dfad87;outline-offset:4px}main{max-width:1280px;padding:44px 40px 32px;margin:auto}header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:35px}.eyebrow{font-size:10px;letter-spacing:3px;color:#8b8279;margin-bottom:12px}h1{font-size:28px;font-weight:550;letter-spacing:-1px;margin:0 0 12px}header p{color:#85817d;font-size:12px;margin:0;line-height:1.8}.switch{display:flex;gap:3px;background:#e3e0dc;padding:4px;border-radius:30px;flex-shrink:0}.switch button{border:0;border-radius:25px;background:none;color:#7d7974;padding:10px 16px;font-size:11px}.switch button.active{background:#fff;color:#282c32;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 32px}.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.label h2{font-size:14px;font-weight:550;margin:0}.label h2 span{font-family:monospace;font-size:11px;color:#9c9388;margin-right:12px}.label a{font-size:10px;color:#8c847c;text-decoration:none}.stage{padding:24px;border-radius:24px;background:radial-gradient(ellipse at 10% 100%,#bfac9d,transparent 70%),linear-gradient(130deg,#81919f,#b5bac2 55%,#738da3);transition:background .2s}.widget{position:relative;aspect-ratio:2/1;container-type:inline-size;isolation:isolate;border-radius:7cqw;overflow:hidden;background:#17202e url('assets/scene.png') center/cover;box-shadow:0 12px 24px #17233338;color:white}.widget:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#050b13a8,transparent 55%)}.brand{position:absolute;top:8%;left:6%;width:27%;height:auto}.pair{position:absolute;display:flex;gap:2.3cqw;left:6%;right:6%;bottom:8%}.action{border:1px solid #ffffff25;background:#293340b8;color:#f5f7fb;display:flex;align-items:center;justify-content:center;gap:2.5cqw;font-size:3.2cqw;letter-spacing:.2cqw;min-width:0;transition:background .15s,transform .15s}.action:hover{background:#4b5665e0}.action:active{transform:scale(.96)}.action svg{height:4.8cqw;width:4.8cqw;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}.a .pair .action{flex:1;height:11cqw;border-radius:4cqw}.a .pair{gap:3cqw}.a .action:last-child{background:#dce4edee;color:#27323e;border-color:#ffffff80}.a .action:last-child:hover{background:white}.a .brand{width:26%}.b:before{background:linear-gradient(90deg,#101925ad,transparent 53%)}.b .brand{width:25%;top:10%}.b .pair{left:6%;right:auto;top:30%;bottom:10%;width:26%;flex-direction:column;gap:2.5cqw}.b .action{height:100%;border-radius:3cqw;font-size:3cqw;gap:2cqw;background:#26303dd4}.b .action svg{width:4.5cqw;height:4.5cqw}.c .brand{width:26%}.c .pair{left:0;right:0;bottom:0;gap:0;height:15cqw;background:#1b2431bb;backdrop-filter:blur(15px);border-top:1px solid #ffffff22}.c .action{flex:1;border:0;border-radius:0;background:transparent;font-size:3.1cqw}.c .action+ .action:before{content:"";position:absolute;left:50%;height:5cqw;width:1px;background:#ffffff28}.c .action:hover{background:#ffffff12}.d .brand{width:23%;top:10%}.d .pair{bottom:7%;left:8%;right:8%;justify-content:space-between}.d .action{border:0;background:transparent;gap:2cqw;font-size:2.8cqw}.d .action svg{box-sizing:content-box;padding:2.7cqw;width:4.7cqw;height:4.7cqw;background:#303c4bbf;border:1px solid #ffffff30;border-radius:50%}.d .action:hover svg{background:#536274}.d .action:last-child{flex-direction:row-reverse}.note{font-size:11px;line-height:1.8;color:#8a847d;margin:12px 0 0}.note strong{color:#55524e;font-weight:500}.toast{position:absolute;top:8%;right:5%;padding:1.7cqw 2.5cqw;border-radius:3cqw;background:#192330ef;font-size:2.3cqw;opacity:0;pointer-events:none;transition:opacity .15s}.toast.show{opacity:1}footer{font-size:10px;color:#9a938b;margin-top:30px;display:flex;justify-content:space-between;gap:15px;line-height:1.8}.actual .stage{display:flex;justify-content:center;padding:30px 12px}.actual .widget{width:360px;max-width:100%;flex-shrink:0}.plain .stage{background:#d6d4d2}.solo .grid{grid-template-columns:minmax(0,800px);justify-content:center}.solo .proposal{display:none}.solo .proposal.selected{display:block}.solo .widget{width:100%}.solo.actual .widget{width:360px}@media(min-width:800px){.widget{border-radius:28px}}@media(max-width:800px){main{padding:28px 20px}.grid{grid-template-columns:1fr;gap:30px}header{align-items:flex-start;flex-direction:column;gap:20px}h1{font-size:24px}.stage{padding:22px}.widget{border-radius:25px}footer{flex-direction:column;gap:4px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<header><div><div class="eyebrow">LYNK & CO / WIDGET STUDIES</div><h1>暮色依旧，布局再轻一点。</h1><p>4 款桌面小部件 · 保留原车景 · 统一 2:1 比例</p></div><div class="switch" aria-label="预览尺寸"><button class="active" data-mode="compare" aria-pressed="true">放大对比</button><button data-mode="actual" aria-pressed="false">360px 预览</button><button data-mode="wallpaper" aria-pressed="false">纯色桌面</button></div></header>
<div class="grid"></div><footer><span>布局交互预览 · 点击按钮可查看反馈，不连接车辆。</span><span>DESIGN EXPLORATION / 2026.10</span></footer></main>
<script>
const icon=(open)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="${open?'M8 10V6a4 4 0 0 1 7.7-1.5':'M8 10V6a4 4 0 0 1 8 0v4'}M12 14v3"/></svg>`;
const options=[['a','01','双胶囊','推荐','操作集中在底部，浅色开锁键突出常用动作。'],['b','02','左侧控制区','车景优先','两颗按键纵向排列，让右侧车辆轮廓完整露出。'],['c','03','通栏控制条','整齐平衡','底部融成一条操作栏，两个动作获得相同空间。'],['d','04','极简悬浮','轻量留白','小圆键贴近两侧，标签向内，中央留给完整场景。']];
document.querySelector('.grid').innerHTML=options.map(([id,num,name,key,note])=>`<section class="proposal" data-id="${id}"><div class="label"><h2><span>${num}</span>${name}</h2><a href="?v=${id}">单独查看 ↗</a></div><div class="stage"><article class="widget ${id}" aria-label="${name}小部件"><img class="brand" src="assets/logo.svg" alt="LYNK & CO"><div class="pair"><button class="action" data-command="关锁">${icon(false)}<span>关锁</span></button><button class="action" data-command="开锁">${icon(true)}<span>开锁</span></button></div><div class="toast" role="status" aria-live="polite"></div></article></div><p class="note"><strong>${key}。</strong>${note}</p></section>`).join('');
const chosen=new URLSearchParams(location.search).get('v');if(options.some(o=>o[0]===chosen)){document.body.classList.add('solo');document.querySelector(`[data-id="${chosen}"]`).classList.add('selected');document.querySelector(`[data-id="${chosen}"] .label a`).href='?';document.querySelector(`[data-id="${chosen}"] .label a`).textContent='返回全部方案 ↗';}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.mode==='wallpaper'){const on=document.body.classList.toggle('plain');b.classList.toggle('active',on);b.setAttribute('aria-pressed',on);return}document.body.classList.toggle('actual',b.dataset.mode==='actual');document.querySelectorAll('[data-mode]:not([data-mode="wallpaper"])').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)})}));
document.querySelectorAll('.widget').forEach(w=>{let timer;w.addEventListener('click',e=>{const b=e.target.closest('[data-command]');if(!b)return;const t=w.querySelector('.toast');t.textContent=`模拟${b.dataset.command} · 仅预览`;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1600)})});
</script></body></html>
